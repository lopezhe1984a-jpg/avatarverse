<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvatarVerse - Platform Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
            </div>
            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                AvatarVerse
            </span>
        </div>

        <div class="flex items-center gap-4">
            <span id="connection-status" class="text-xs px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Conectando...
            </span>
            <div class="w-9 h-9 rounded-full bg-slate-700 overflow-hidden border-2 border-indigo-500">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Content Layout -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Feed Principal -->
        <main class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
            
            <!-- Editor de Publicación y JSON -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                <textarea id="prompt-input" placeholder="Escribe el prompt para la generación de tu render..." class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none h-16"></textarea>
                
                <textarea id="json-input" placeholder='Configuración JSON (ej. {"lighting": "chiaroscuro", "resolution": "8k"})' class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-indigo-300 focus:outline-none focus:border-indigo-500 resize-none h-20"></textarea>

                <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                    <span class="text-xs text-slate-500">Motor visual v2.4 activo</span>
                    <button onclick="publishRender()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition-all shadow-lg shadow-indigo-500/20">
                        Generar y Publicar
                    </button>
                </div>
            </div>

            <!-- Feed de Renders Dinámicos -->
            <div id="feed-container" class="space-y-6"></div>
        </main>

        <!-- Right Panel Direct Messages -->
        <aside class="w-80 border-l border-slate-800 bg-slate-900/40 p-4 flex flex-col justify-between hidden xl:flex">
            <div>
                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Mensajes Directos</h4>
                <div id="chat-box" class="space-y-3 h-96 overflow-y-auto custom-scrollbar pr-2">
                    <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-700/30 text-xs">
                        <span class="font-semibold text-indigo-400">Sistema:</span> Chat listo en tiempo real.
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-4 border-t border-slate-800">
                <input id="message-input" type="text" placeholder="Enviar mensaje..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 p-2 rounded-xl text-white">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>
    </div>

    <script>
        lucide.createIcons();

        // Conexión Realtime y Cliente Central
        const socket = io('http://localhost:5000', { autoConnect: false });
        const USER = { userId: "usr_9082", username: "Héctor López" };

        const statusEl = document.getElementById('connection-status');
        const feedContainer = document.getElementById('feed-container');

        // Intento de conexión al backend
        socket.connect();

        socket.on('connect', () => {
            statusEl.className = "text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2";
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Conectado`;
            socket.emit('register_user', { userId: USER.userId });
        });

        socket.on('disconnect', () => {
            statusEl.className = "text-xs px-3 py-1 rounded-full bg-pink-500/10 text-pink-400 border border-pink-500/20 flex items-center gap-2";
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-pink-400"></span> Desconectado`;
        });

        // Escuchar publicaciones entrantes
        socket.on('new_post', (post) => {
            renderPostCard(post, true);
        });

        // Renderizar tarjeta de publicación
        function renderPostCard(post, prepend = false) {
            const card = document.createElement('article');
            card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl";
            card.innerHTML = `
                <div class="p-4 flex items-center justify-between border-b border-slate-800/60">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-slate-700 border border-indigo-500/50"></div>
                        <div>
                            <h4 class="text-sm font-semibold text-slate-200">${post.username}</h4>
                            <p class="text-[10px] text-slate-400">ID: ${post.id}</p>
                        </div>
                    </div>
                </div>
                <div class="p-4 space-y-3">
                    <p class="text-sm text-slate-300">${post.prompt}</p>
                    <div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-950">
                        <img src="${post.imageUrl}" class="w-full object-cover max-h-[400px]">
                    </div>
                    <pre class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 text-[11px] font-mono text-indigo-300 overflow-x-auto">${JSON.stringify(post.jsonConfig, null, 2)}</pre>
                </div>
            `;
            if (prepend) {
                feedContainer.prepend(card);
            } else {
                feedContainer.appendChild(card);
            }
        }

        // Publicar nuevo render
        async function publishRender() {
            const prompt = document.getElementById('prompt-input').value;
            const jsonText = document.getElementById('json-input').value;

            if (!prompt) return alert("Por favor ingresa un prompt.");

            let parsedJson = {};
            try {
                parsedJson = jsonText ? JSON.parse(jsonText) : { preset: "default" };
            } catch (e) {
                return alert("El formato JSON no es válido.");
            }

            try {
                await fetch('http://localhost:5000/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: USER.userId,
                        username: USER.username,
                        prompt: prompt,
                        jsonConfig: parsedJson
                    })
                });
                document.getElementById('prompt-input').value = '';
                document.getElementById('json-input').value = '';
            } catch (err) {
                console.error("Error al publicar:", err);
            }
        }

        // Envío de chat
        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value) return;

            const chatBox = document.getElementById('chat-box');
            const msgNode = document.createElement('div');
            msgNode.className = "bg-indigo-600/20 p-2.5 rounded-xl border border-indigo-500/30 text-xs ml-4 text-slate-200";
            msgNode.innerText = input.value;
            chatBox.appendChild(msgNode);

            socket.emit('send_message', { senderId: USER.userId, receiverId: 'peer_1', message: input.value });
            input.value = '';
        }
    </script>
</body>
</html>
