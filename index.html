<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AvatarVerse 3.1 — Real Product Prototype</title>
<style>
:root{--bg:#050816;--panel:#10172b;--line:#29375b;--p:#8b5cf6;--c:#22d3ee;--muted:#9aa7c5}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#172554,#050816 60%);color:white;font-family:Arial,sans-serif;scroll-behavior:smooth}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:#0b1020;padding:25px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:30px;font-weight:900}.logo span{color:var(--c)}
aside button{width:100%;padding:14px;margin:7px 0;border-radius:14px;background:#151d35;color:white;border:1px solid var(--line);text-align:left;cursor:pointer;transition:.2s}
aside button:hover, aside button.active{background:var(--p);border-color:var(--c)}
main{padding:30px;max-width:1100px}
.card{background:rgba(16,23,43,.92);border:1px solid var(--line);border-radius:22px;padding:24px;margin:15px 0}
.primary{background:linear-gradient(90deg,var(--p),var(--c));border:0;font-weight:bold;cursor:pointer;transition:.2s}
.primary:hover{opacity:.9}
button{padding:14px;margin:6px 0;border-radius:14px;background:#151d35;color:white;border:1px solid var(--line);cursor:pointer;width:100%}
input,select,textarea{width:100%;padding:14px;margin:8px 0;background:#070b16;color:white;border:1px solid var(--line);border-radius:12px;font-family:inherit}
textarea{height:100px;resize:vertical}
.toast{position:fixed;right:20px;bottom:20px;background:#111a33;border:1px solid var(--c);padding:14px 20px;border-radius:14px;display:none;z-index:100}
.toast.show{display:block}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="logo">Avatar<span>Verse</span></div>
<div style="margin-top:20px">
<button class="active" onclick="show('home', this)">🏠 Inicio</button>
<button onclick="show('create', this)">🚀 Crear</button>
<button onclick="show('projects', this)">📚 Proyectos</button>
<button onclick="show('profile', this)">👤 Perfil</button>
</div>
</aside>
<main>
<section id="home">
<div class="card">
<h1>AvatarVerse 3.1</h1>
<p style="color:var(--muted)">Prototipo interactivo avanzado del ecosistema creativo impulsado por IA.</p>
<button class="primary" onclick="show('create', document.querySelectorAll('aside button')[1])" style="width:auto;padding:14px 28px;margin-top:10px">Crear proyecto</button>
</div>
</section>

<section id="create" style="display:none">
<div class="card" style="max-width:700px">
<h2>Nuevo proyecto</h2>
<label>Nombre del proyecto</label>
<input id="projName" placeholder="Ej.: Universo Cibernético 3.1">
<label>Tipo de Contenido</label>
<select id="projType">
<option value="Avatar">🎭 Avatar</option>
<option value="Imagen">🖼️ Imagen</option>
<option value="Video">🎬 Video</option>
</select>
<label>Descripción y Parámetros</label>
<textarea id="projDesc" placeholder="Describe los detalles creativos, iluminación y estilo..."></textarea>
<button class="primary" onclick="saveProject()">Guardar en el Ecosistema</button>
</div>
</section>

<section id="projects" style="display:none">
<div class="card">
<h2>Mis proyectos</h2>
<div id="list" style="margin-top:15px"></div>
</div>
</section>

<section id="profile" style="display:none">
<div class="card" style="max-width:550px">
<h2>Perfil Creator</h2>
<p style="color:var(--muted)">Usuario: <b>AvatarVerse Creator Pro</b><br>Plan: <b>Pro Enterprise</b><br>Créditos de IA: <b>100 / 100</b></p>
<button class="primary" style="margin-top:15px;width:auto;padding:10px 20px" onclick="showToast('Sincronización de perfil completada')">Actualizar Estado</button>
</div>
</section>
</main>
</div>

<div class="toast" id="toastMsg">¡Acción ejecutada con éxito!</div>

<script>
function show(id, btn){
  document.querySelectorAll('main section').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'block';
  if(btn){
    document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  if(id === 'projects') load();
}

function showToast(msg){
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function saveProject(){
  const name = document.getElementById('projName').value.trim();
  const type = document.getElementById('projType').value;
  const desc = document.getElementById('projDesc').value.trim();

  if(!name || !desc){
    showToast('⚠️ Por favor completa todos los campos.');
    return;
  }

  let projects = JSON.parse(localStorage.getItem('avatarverse_31_projects') || '[]');
  projects.unshift({name, type, desc, date: new Date().toLocaleDateString()});
  localStorage.setItem('avatarverse_31_projects', JSON.stringify(projects));
  
  document.getElementById('projName').value = '';
  document.getElementById('projDesc').value = '';
  
  showToast('✨ ¡Proyecto guardado con éxito!');
  show('projects', document.querySelectorAll('aside button')[2]);
}

function load(){
  let projects = JSON.parse(localStorage.getItem('avatarverse_31_projects') || '[]');
  const list = document.getElementById('list');
  
  if(!projects.length){
    list.innerHTML = '<p style="color:var(--muted)">No hay proyectos registrados aún.</p>';
    return;
  }
  
  list.innerHTML = projects.map((x, idx) => `
    <div class="card" style="background:#070b16;margin-bottom:15px;position:relative">
      <h3 style="margin:0 0 8px 0">🎨 ${x.name} <span style="font-size:12px;color:var(--c);font-weight:normal">(${x.type})</span></h3>
      <p style="color:var(--muted);margin:5px 0 10px 0">${x.desc}</p>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--muted)">Creado: ${x.date}</span>
        <button onclick="deleteProject(${idx})" style="width:auto;padding:6px 12px;background:#29375b;font-size:12px">Eliminar</button>
      </div>
    </div>
  `).join('');
}

function deleteProject(idx){
  let projects = JSON.parse(localStorage.getItem('avatarverse_31_projects') || '[]');
  projects.splice(idx, 1);
  localStorage.setItem('avatarverse_31_projects', JSON.stringify(projects));
  load();
  showToast('🗑️ Proyecto eliminado.');
}

load();
</script>
</body>
</html>
