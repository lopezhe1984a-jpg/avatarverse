<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvatarVerse</title>
  <style>
    :root {
      --bg-dark: #121318;
      --card-bg: #1e1f26;
      --accent-yellow: #f5b800;
      --accent-purple: #7a3ef8;
      --text-white: #ffffff;
      --text-muted: #8e8f9a;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Contenedor Principal */
    #studio-app-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      box-sizing: border-box;
    }

    /* Top Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 20px;
      font-weight: bold;
    }

    .badge-pro {
      background: linear-gradient(90deg, #ff5e62, #ff9966);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    /* Switch Imagen / Video */
    .mode-toggle {
      display: flex;
      background: #000;
      border-radius: 20px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent-yellow);
      color: #000;
    }

    /* Carrusel de Motores */
    .engines-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .engine-chip {
      background: var(--card-bg);
      border: 1px solid #333;
      color: var(--text-white);
      padding: 6px 14px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 13px;
    }

    .engine-chip.active {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    /* Carrusel de Tareas */
    .tasks-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .task-card {
      min-width: 80px;
      background: var(--card-bg);
      padding: 12px 8px;
      border-radius: 12px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
    }

    .task-card.active {
      border: 1px solid var(--accent-yellow);
    }

    /* Prompts y Controles */
    .input-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 12px;
      color: #fff;
      padding: 10px;
      box-sizing: border-box;
      resize: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="studio-app-container">
    <!-- Header -->
    <div class="top-nav">
      <div class="app-title">Dreamerland <span class="badge-pro">PRO</span></div>
      <div>🪙 42</div>
    </div>

    <!-- Toggle Selector -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnImgMode" onclick="switchStudioMode('image')">📷 Imagen</button>
      <button class="mode-btn" id="btnVidMode" onclick="switchStudioMode('video')">🎥 Video</button>
    </div>

    <!-- Motores -->
    <div class="engines-scroll" id="enginesScroll"></div>

    <!-- Tareas -->
    <div class="tasks-grid" id="tasksGrid"></div>

    <!-- Controles -->
    <div>
      <label style="font-size: 12px; color: var(--text-muted);">Prompt Principal</label>
      <textarea id="promptArea" class="input-box" rows="3" placeholder="Describe tu imagen o video..."></textarea>
    </div>
  </div>

  <script>
    // Namespace aislado para evitar errores sintácticos
    (function() {
      const data = {
        mode: 'image',
        engines: {
          image: ['SDXL', 'Anima', 'Z Image', 'Krea2', 'SD1.5', 'Flux.2', 'Qwen', 'NB⚡', 'GPT Image⚡', 'Seedream⚡', 'Wan', 'Flux'],
          video: ['Wan', 'Seedance⚡', 'Grok Imagine⚡', 'Kling⚡', 'Hunyuan']
        },
        tasks: {
          image: ['Texto a imagen', 'Imagen a imagen', 'Inpaint', 'Pintar afuera', 'Dibujar'],
          video: ['Texto a Video', 'Imagen a Video', 'Referencia a Video', 'Lipsync', 'Animación']
        }
      };

      window.switchStudioMode = function(newMode) {
        data.mode = newMode;
        document.getElementById('btnImgMode').classList.toggle('active', newMode === 'image');
        document.getElementById('btnVidMode').classList.toggle('active', newMode === 'video');
        renderEngines();
        renderTasks();
      };

      function renderEngines() {
        const container = document.getElementById('enginesScroll');
        if (!container) return;
        container.innerHTML = data.engines[data.mode].map((eng, idx) => `
          <button class="engine-chip ${idx === 0 ? 'active' : ''}">${eng}</button>
        `).join('');
      }

      function renderTasks() {
        const container = document.getElementById('tasksGrid');
        if (!container) return;
        container.innerHTML = data.tasks[data.mode].map((task, idx) => `
          <div class="task-card ${idx === 0 ? 'active' : ''}">${task}</div>
        `).join('');
      }

      // Render inicial seguro
      document.addEventListener('DOMContentLoaded', () => {
        switchStudioMode('image');
      });
    })();
  </script>

</body>
</html>
